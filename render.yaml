# Render blueprint for the Odin Stream API.
# Values marked sync: false are entered in the Render dashboard and are never committed.
services:
  - type: web
    name: odin-stream-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://odin-stream-8zqkdl.freebuff.page,https://odin-stream-8zqkdl-preview.freebuff.page
