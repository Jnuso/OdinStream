name: Database migrations

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test migrations and database policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.95.3
      - name: Start local database and apply migrations
        run: supabase db start
      - name: Run database tests
        run: supabase test db

  deploy-development:
    name: Deploy migrations to development
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    environment: supabase-development
    concurrency:
      group: supabase-development-migrations
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.95.3
      - name: Verify deployment configuration
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo 'Configure the development session pooler URL as the SUPABASE_DB_URL environment secret before deployment.' >&2
            exit 1
          fi
      - name: Apply reviewed migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
