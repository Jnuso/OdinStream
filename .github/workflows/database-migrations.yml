name: Database migrations

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test migrations and database policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.95.3
      - name: Start local database and apply migrations
        run: supabase db start
      - name: Run database tests
        run: supabase test db

  deploy-development:
    name: Deploy migrations to development
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    environment: supabase-development
    concurrency:
      group: supabase-development-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.95.3
      - name: Verify deployment configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo 'Configure the Supabase development environment secrets and project reference before deployment.' >&2
            exit 1
          fi
      - name: Link development project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply reviewed migrations
        run: supabase db push --linked --yes
